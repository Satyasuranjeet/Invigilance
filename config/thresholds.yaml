eye_gaze:
  away_angle_deg: 25
  away_duration_sec: 2.0
head_pose:
  yaw_threshold_deg: 30
  pitch_threshold_deg: 20
shoulder:
  lateral_shift_ratio: 0.15
lip:
  movement_var_threshold: 0.02
